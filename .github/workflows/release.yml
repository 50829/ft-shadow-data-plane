name: Release OCI and SIF

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/50829/ft-shadow-data-plane:${{ github.ref_name }}
          provenance: false
          sbom: false
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2
      - run: apptainer build ft-shadow-data-plane.sif docker://ghcr.io/50829/ft-shadow-data-plane@${{ steps.image.outputs.digest }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ft-shadow-data-plane.sif --generate-notes
